<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>契約書作成｜確認ワークスペース</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="brand">TMS</span><strong>契約書MAX</strong><span class="sub">売買契約書作成システム</span></div><span id="mode"></span></header>
<div class="shell"><aside><p class="overline">業務メニュー</p><nav aria-label="メインメニュー"><a href="#" class="side-link">案件一覧</a><a href="#settings" class="side-link">設定</a><a href="#help" class="side-link">使い方</a></nav><p class="note">資料を入れ、違いを確認し、契約書を作成します。</p><div id="usage"></div></aside>
<main><div id="notice" role="status"></div><div id="error" role="alert"></div><div id="view"><p>読み込み中…</p></div></main></div>
<dialog id="confirm"><h2>この差分を採用しますか？</h2><div id="confirm-text"></div><p>採用した値だけ確定値に反映します。</p><div class="actions"><button id="cancel">戻る</button><button id="accept" class="primary">採用する</button></div></dialog>
<dialog id="ai-confirm"><h2>AI解析前の確認</h2><p id="ai-confirm-text"></p><div class="actions"><button id="ai-cancel">キャンセル</button><button id="ai-start" class="primary">解析して続ける</button></div></dialog>
<script src="/app.js"></script></body></html>
