<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>契約書作成｜確認ワークスペース</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><span class="brand">TMS</span><strong>契約書作成</strong><span class="sub">確認ワークスペース</span></div><span id="mode"></span></header>
<div class="shell"><aside><p class="overline">WORKSPACE</p><a href="#" class="side-link">案件一覧</a><p class="note">読取済みの資料を確認し、差分を採用してからExcelを生成します。</p><div id="usage"></div></aside>
<main><div id="notice" role="status"></div><div id="error" role="alert"></div><div id="view"><p>読み込み中…</p></div></main></div>
<dialog id="confirm"><h2>この差分を採用しますか？</h2><p id="confirm-text"></p><p>採用した値だけ確定値に反映します。</p><div class="actions"><button id="cancel">戻る</button><button id="accept" class="primary">採用する</button></div></dialog>
<script src="/app.js"></script></body></html>
