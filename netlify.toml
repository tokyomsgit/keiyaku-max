[build]
  publish = "public-demo-dist"
  command = "python build_public_demo.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://afdtohxuzuwlqmjbrpar.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://afdtohxuzuwlqmjbrpar.supabase.co"
