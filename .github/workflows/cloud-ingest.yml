name: cloud-ingest

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private storage job id
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-ingest-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - name: Install readers
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null
          python -m pip install -q -r requirements-cloud.txt
      - name: Read documents
        env:
          JOB_ID: ${{ inputs.job_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUTF8: '1'
          LOCAL_READ_KINDS: rules
        # Output stays minimal: this repository's Actions logs are public.
        run: python cloud_worker.py > /dev/null 2>&1 || echo "worker exited"
